name: Update U18 AmeriCup Dashboard

# This tournament (Irapuato, Mexico — 9-15 Jun 2026) has already finished, so
# there is nothing to poll for. Manual trigger only, e.g. to rebuild the
# dashboard after a template change.
on:
  workflow_dispatch:

concurrency:
  group: update-u18-americup
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape tournament and build dashboard
        # FIBA's /en/events index only carries current/upcoming events, so a
        # finished tournament like this one has aged off it and --event
        # name-matching can't find it. Use the exact slug instead (confirmed
        # from the fiba.basketball event page URL for this tournament).
        run: |
          python fiba_scrape.py \
            --slug fiba-u18-womens-americup-2026 \
            --event-name "FIBA U18 Women's AmeriCup" \
            --start 2026-06-09 --end 2026-06-15 --host "Irapuato, Mexico" \
            --qualify-spots 2 \
            --name "U18 AmeriCup 2026" \
            --publish-slug u18-americup-2026

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs "U18 AmeriCup 2026"
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update U18 AmeriCup dashboard $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || {
              echo "Rebase hit a conflict — leaving branch alone; retry the run."
              exit 0
            }
            git push origin HEAD:"${{ github.ref_name }}"
          fi
